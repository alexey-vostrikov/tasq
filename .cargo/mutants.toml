# Настройки мутационного замера.
#
# Замер стоит времени на КАЖДОГО мутанта: дерево собирается заново, затем гоняются тесты.
# Здесь только то, что конфиг этой версии (27.1.0) действительно принимает — ключи и их
# ТИПЫ проверены прогоном: строковое `cap_lints = "true"` отбивается «invalid type: string,
# expected a boolean», а `jobs`, `package`, `shard`, `in_place`, `baseline`, `test_args`
# конфигом не задаются вовсе (только флагами).
#
# Тесты НЕ сужены: подмена `additional_cargo_test_args` на `--lib` ускоряет прогон втрое,
# но тогда мутант, которого ловит только интеграционный набор, честно печатается как
# выживший — и «score» падает не из-за слабых тестов, а из-за команды. Проверка на
# `src/project.rs` это подтвердила: 5 мутантов, 4 «missed» при `--lib` против настоящих
# проверок в `tests/projects.rs`. Узкая команда допустима только явно, на файл, где
# известно, какой набор его проверяет (`make mutants-file FILE=… TEST_ARGS='--test …'`).

# Кэш линтов: иначе мутант, снявший условие под `#[deny]`, падает на предупреждениях и
# попадает в UNVIABLE вместо честного «убит» или «выжил».
cap_lints = true

# Таймаут: мутант, снявший условие выхода из цикла, вешает прогон; предел важнее точности.
timeout_multiplier = 4.0
build_timeout_multiplier = 2.0

# Копия каталога сборки в каждый рабочий каталог. Без неё работник собирает все зависимости
# с нуля (98 крейтов ≈ 80 с) на КАЖДОГО мутанта — именно это и делало прогон суточным.
# С копией собирается только наш крейт.
copy_target = true
copy_vcs = false
gitignore = true

# Файлы, где подменять нечего: тонкая обёртка бинаря (всё тело — вызовы библиотеки).
exclude_globs = ["src/lib.rs"]

# Сайты, которые не являются решениями: подстановка `Default` и пустых строк в конструкторах
# моделей. Такие мутанты нечем убить (значение мёртвое), а прогон они удлиняют.
exclude_re = [
  "^replace .* with Default::default\\(\\)",
  "^replace .* with String::new\\(\\)",
]
