name: ci

on:
  push:
    branches: [main]
  pull_request:

# Всё собирается на той же базе, что и локальная сборка (make): Debian 11 + тулчейн 1.99.1.
# База задаёт порог glibc готового бинаря (2.31) — на bookworm он 2.34, и артефакт не
# запускается на Astra/Debian 11. Детали — в Dockerfile.
jobs:
  check:
    # ОС раннера фиксируется: работа всё равно идёт в контейнере,
    # а ubuntu-latest уже объявлен к переезду на Ubuntu 26.
    runs-on: ubuntu-24.04
    container: rust:1.90-bullseye
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      # Версия берётся из `rust-toolchain.toml`, а не из тега образа: базовый образ
      # несёт 1.90, а гейты должны идти на том компиляторе, что записан в проекте.
      - name: Pin the toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup default 1.99.1
          rustup component add rustfmt clippy
          cargo --version && rustc --version

      - name: Add cargo-deny
        run: sh scripts/install-cargo-deny.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Dependency policy
        run: cargo deny check

      - name: Test
        run: cargo test --all-targets

      - name: Coverage floor
        run: |
          sh scripts/install-cargo-llvm-cov.sh
          # Тот же страж, что и в `make cov`: отсутствие инструмента обязано быть отказом с
          # названной причиной, а не вопросом rustup `Proceed? [Y/n]` и ожиданием загрузки,
          # которое в CI выглядит как таймаут джобы.
          llvm_cov="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-cov"
          test -x "$llvm_cov" || { echo "LLVM_TOOLS_MISSING: $llvm_cov" >&2; exit 1; }
          cargo llvm-cov --all-targets --summary-only --fail-under-lines 90

      - name: Build
        run: cargo build --release

      - name: Smoke test (init + doctor outside the repo)
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/target/release/tasq"
          work="$(mktemp -d)"
          cd "$work"
          "$bin" --version
          "$bin" init --key TASQ --name "smoke"
          "$bin" doctor --check
          "$bin" doctor --json > doctor.json
          grep -q '"ok": true' doctor.json

      - name: TUI frame without a terminal
        # `--once` рисует один кадр в буфер памяти и печатает его: единственный способ проверить
        # TUI там, где нет tty. Пустой или упавший кадр обязан быть слышен здесь, а не у человека.
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/target/release/tasq"
          work="$(mktemp -d)"
          cd "$work"
          "$bin" init --key TUI --name "tui smoke" > /dev/null
          "$bin" --project TUI add "узел для кадра" > /dev/null
          frame="$("$bin" --project TUI tui --once)"
          printf '%s\n' "$frame" | grep -q 'TUI-1' || { printf '%s\n' "$frame" >&2; echo "TUI_FRAME_MISSING_NODE: узел не попал в кадр" >&2; exit 1; }
          printf '%s\n' "$frame" | grep -q 'доска' || { printf '%s\n' "$frame" >&2; echo "TUI_FRAME_MISSING_TABLE: таблица не нарисована" >&2; exit 1; }

      - name: glibc floor of the artifact
        # Вторая половина — негативный контроль: предел 2.9 ниже реального порога по значению,
        # но выше при строковом сравнении, поэтому обязан быть отвергнут. Гейт, сравнивающий
        # версии как строки, проходит эту проверку зелёным — и перестаёт что-либо значить.
        run: |
          sh scripts/check-glibc-floor.sh target/release/tasq 2.31
          if sh scripts/check-glibc-floor.sh target/release/tasq 2.9; then
            echo "the gate accepts 2.9 for a 2.3x binary: versions compare as strings" >&2
            exit 1
          fi

      - name: Tool schema budget
        run: ./target/release/tasq tokens --max 6000

      - name: Reference docs are up to date
        run: ./target/release/tasq docs --check
