[package]
name = "tasq"
version = "0.7.2"
edition = "2024"
rust-version = "1.99"
description = "Local-first task tracker for AI agents: dot-notation IDs, expiring leases, resource reservations, burn-up"
license = "MIT"
repository = "https://github.com/alexey-vostrikov/tasq"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
rusqlite = { version = "0.41", features = ["bundled", "functions", "collation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiktoken-rs = { version = "0.12", default-features = false }
toml_edit = "0.25"
getrandom = "0.4"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
clap_complete = "4.5"
serde-saphyr = "2.1.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std"] }
# Только флаг на SIGTERM/SIGINT/SIGHUP: крейт уже есть в дереве через crossterm, отдельной
# зависимости «в нагрузку» он не тянет. Нужен, чтобы `kill` не оставлял терминал в raw mode с
# захваченной мышью — при сигнале размотки стека нет, и `Drop` не срабатывает.
signal-hook = "0.3"

[dev-dependencies]
# Property-тесты вместо cargo-fuzz: fuzz-раннер требует nightly и ASAN, а гейт должен
# идти в том же стабильном образе, что и остальная сборка. Генераторы при этом дают
# тот же класс входа — мусор, обрезанные строки, юникод, вложенные скобки.
proptest = "1.12"

[lints.rust]
unsafe_code = "forbid"
