[package]
name = "tasq"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local-first task tracker for AI agents: dot-notation IDs, expiring leases, resource reservations, burn-up"
license = "MIT"
repository = "https://github.com/alexey-vostrikov/tasq"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }

[lints.rust]
unsafe_code = "forbid"
